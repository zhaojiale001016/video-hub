<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Hub · 视频搬运中台</title>
<link rel="stylesheet" href="/static/vendor/daisyui.min.css">
<script src="/static/vendor/tailwind.js"></script>
<style>
  :root {
    /* B站品牌色: daisyUI4 变量须用 OKLCH 分量 (lightness% chroma hue) */
    --p: 72.57% 0.1707 4.45 !important;    /* #FB7299 B站粉 */
    --pf: 65.51% 0.1901 3.19 !important;   /* 按下深粉 */
    --pc: 99% 0.01 0 !important;           /* 粉上白字 */
    --in: 66.47% 0.1337 230.84 !important; /* #00a1d6 B站蓝 */
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: #f1f2f3; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #ccd0d9; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #b0b8c5; }

  /* 状态色边条(B站语境: 待发布=粉 已发布=蓝) */
  .gcard { border-left: 3px solid transparent; }
  .gcard.st-ready { border-left-color: #fb7299; }
  .gcard.st-new, .gcard.st-downloaded { border-left-color: #00a1d6; }
  .gcard.st-published { border-left-color: #23ade5; }
  .gcard.st-failed { border-left-color: #f43f5e; }
  .gcard.st-skipped { border-left-color: #b8c0cc; opacity: .75; }
  .gcard.st-published { opacity: .85; }

  .gcard:hover figure img { transform: scale(1.04); }
  .gcard figure img { transition: transform .25s; }

  /* 无封面占位(B站灰) */
  .no-cover { background: linear-gradient(160deg, #e5e9ef, #d6dbe3); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: #9499a0; font-size: 12px; }

  .btn.busy { pointer-events: none; }
  .btn.busy::before { content: ""; width: 12px; height: 12px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }

  #drawer { transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  #drawer.open { transform: translateX(0); }

  /* B站标签式徽标 */
  .b-line-music { background: #e8f5e9; color: #2e7d32; border: 0; }
  .b-line-relax { background: #fff3e0; color: #e65100; border: 0; }
  .b-line-adventure { background: #e3f2fd; color: #1565c0; border: 0; }
  .b-dtime { background: #f3e5f5; color: #7b1fa2; border: 0; }
  .b-bv { background: #e1f5fe; color: #00a1d6; border: 0; }
  .b-nosub { background: #f1f3f5; color: #8a94a6; border: 0; }

  /* 侧栏激活态用B站粉 */
  .nav-act { background: #ffe9f0 !important; color: #fb7299 !important; }
</style>
</head>
<body class="bg-base-200 text-base-content">

<!-- ══ 顶栏 ══ -->
<div class="navbar bg-base-100 border-b border-base-300 px-5 gap-3 min-h-14">
  <div class="flex items-center gap-2">
    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-[15px]"
          style="background:linear-gradient(135deg,#fb7299,#ff8fab)">📺</span>
    <span class="font-bold text-[15px] tracking-tight">Video Hub</span>
    <span class="text-[10px] text-base-content/40 mt-0.5" id="platSub">视频搬运中台 · 多平台投递</span>
  </div>
  <div class="flex-1"></div>
  <div class="flex gap-2 items-center">
    <button class="btn btn-sm btn-ghost" onclick="doPoll()">↻ 轮询源</button>
    <button class="btn btn-sm btn-ghost" onclick="doDownload()">⬇ 下载全部</button>
    <button class="btn btn-sm btn-ghost" onclick="document.getElementById('impModal').showModal()" title="本地视频文件导入流水线">📁 导入本地</button>
    <button class="btn btn-sm btn-ghost" onclick="openBiliLogin()" title="B站APP扫码登录(无需终端)">🔐 B站登录</button>
    <div class="w-px h-5 bg-base-300"></div>
    <button class="btn btn-sm btn-primary" onclick="doPublishAll(false)">▶ 发布全部</button>
    <button class="btn btn-sm btn-outline" onclick="doPublishAll(true)" title="按 publish_slots 错峰定时">⏱ 错峰定时</button>
    <div class="w-px h-5 bg-base-300"></div>
    <div class="dropdown dropdown-end">
      <button tabindex="0" class="btn btn-sm btn-ghost">⋯ 更多</button>
      <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 border border-base-300 rounded-box shadow-lg w-44 p-1.5 z-50">
        <li><a onclick="openSettings()">⚙️ 设置</a></li>
        <li><a onclick="showSources()">📡 源状态</a></li>
        <li><a onclick="doVerify()">🔎 巡检存活</a></li>
        <li><a onclick="doReconcile()">🔧 调和残留</a></li>
        <li><a onclick="doCleanup()">🧹 清理文件</a></li>
      </ul>
    </div>
    <button class="btn btn-sm btn-ghost" onclick="loadAll()" title="刷新数据">⟳ 刷新</button>
  </div>
</div>

<div class="flex" style="height: calc(100vh - 56px)">

  <!-- ══ 侧边导航 ══ -->
  <aside class="w-44 min-w-44 bg-base-100 border-r border-base-300 flex flex-col py-3 px-2 gap-1 overflow-y-auto">
    <div id="nav"></div>
    <div class="text-[10px] text-base-content/40 tracking-widest px-3 pt-4 pb-1">类型</div>
    <div id="lines"></div>
    <div id="foot" class="mt-auto px-3 pt-3 text-[11px] text-base-content/40 leading-6"></div>
  </aside>

  <!-- ══ 主区 ══ -->
  <main class="flex-1 flex flex-col min-w-0">
    <div class="px-4 pt-3.5 pb-3 border-b border-base-300 bg-base-100">
      <div class="flex gap-2.5 flex-wrap" id="stats"></div>
    </div>
    <div class="px-4 py-2.5 border-b border-base-300 bg-base-100 flex items-center gap-3">
      <input type="text" id="q" class="input input-sm input-bordered w-64"
             placeholder="🔍 搜索 标题 / UP主" oninput="renderList()">
      <span id="cnt" class="text-xs text-base-content/45"></span>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="gridwrap">
      <div class="grid gap-3.5" style="grid-template-columns: repeat(auto-fill, minmax(248px, 1fr))" id="list"></div>
    </div>
  </main>
</div>

<!-- ══ 编辑抽屉 ══ -->
<div id="drawer" class="fixed right-0 top-0 bottom-0 w-[480px] bg-base-100 border-l border-base-300 shadow-2xl z-50 flex flex-col"></div>

<!-- ══ 任务中心 ══ -->
<div class="fixed right-4 bottom-4 z-40">
  <div id="jobs" class="hidden mb-3 w-[370px] max-h-[46vh] overflow-auto card bg-base-100 border border-base-300 shadow-xl text-xs"></div>
  <button id="jobsfab" class="btn btn-primary btn-circle hidden shadow-lg ml-auto"
          onclick="document.getElementById('jobs').classList.toggle('hidden')">
    ⚙<span id="jobsn" class="absolute -top-1 -right-1 badge badge-error badge-xs"></span>
  </button>
</div>

<div id="toast" class="toast toast-top toast-center z-[300] hidden"></div>
<datalist id="missionlist"></datalist>

<!-- 视频预览 -->
<dialog id="lb" class="modal" onclick="if(event.target===this)this.close()">
  <div class="modal-box max-w-5xl p-2 bg-black">
    <video id="lbv" controls playsinline class="w-full rounded"></video>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- 导入本地 -->
<dialog id="impModal" class="modal">
  <div class="modal-box max-w-md">
    <div class="font-bold text-sm mb-1">📁 导入本地视频</div>
    <div class="text-[11px] text-base-content/50 mb-4">文件复制进下载目录统一管理(源文件不动); 默认版权=自制, 可在卡片编辑里改</div>
    <label class="text-xs text-base-content/60">文件路径(本机绝对路径)</label>
    <input id="impPath" class="input input-sm input-bordered w-full mt-1 mb-3" placeholder="/Users/you/Videos/foo.mp4">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-base-content/60">内容线</label>
        <input id="impLine" class="input input-sm input-bordered w-full mt-1" value="local"></div>
      <div><label class="text-xs text-base-content/60">原标题(可空)</label>
        <input id="impTitle" class="input input-sm input-bordered w-full mt-1" placeholder="默认取文件名"></div>
    </div>
    <label class="flex items-center gap-2 mt-4 text-xs cursor-pointer">
      <input type="checkbox" id="impProc" class="checkbox checkbox-sm" checked>
      立即处理(字幕+LLM元数据→ready); 取消则只入库待手动下载
    </label>
    <div class="modal-action">
      <button class="btn btn-sm btn-primary" onclick="doImport(this)">导入</button>
      <form method="dialog"><button class="btn btn-sm">取消</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- B站扫码登录 -->
<dialog id="biliModal" class="modal">
  <div class="modal-box max-w-xs text-center">
    <div class="font-bold text-sm mb-1">🔐 B站扫码登录</div>
    <div class="text-[11px] text-base-content/50 mb-3">用<b>B站APP</b>扫一扫, 确认后自动写 cookies.json<br>不依赖终端/二进制; 过期了点下方重新生成</div>
    <img id="biliQr" class="w-56 h-56 mx-auto rounded-lg border border-base-300" src="">
    <div id="biliQrStatus" class="text-xs mt-3 text-base-content/60">生成中…</div>
    <div class="modal-action justify-center">
      <button class="btn btn-sm btn-ghost" onclick="openBiliLogin()">重新生成</button>
      <form method="dialog"><button class="btn btn-sm">关闭</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- 设置 -->
<dialog id="setModal" class="modal">
  <div class="modal-box max-w-4xl">
    <div class="flex items-center mb-3">
      <div class="font-bold text-sm">⚙️ 设置 <span class="text-[11px] font-normal text-base-content/40 ml-1">保存即生效(热更新), 写入 config/overrides.json</span></div>
    </div>
    <div class="overflow-y-auto max-h-[70vh] pr-1" id="setbody">
      <div class="text-center py-8 text-base-content/40">加载中…</div>
    </div>
    <div class="modal-action mt-4 pt-3 border-t border-base-300">
      <button class="btn btn-sm btn-primary" onclick="saveSettings()">💾 保存设置</button>
      <form method="dialog"><button class="btn btn-sm">关闭</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- 源状态 -->
<dialog id="srcModal" class="modal">
  <div class="modal-box max-w-3xl">
    <div class="font-bold text-sm mb-3">📡 源状态 · 最近轮询</div>
    <div class="overflow-x-auto max-h-[60vh]">
      <table class="table table-xs">
        <thead><tr><th>源</th><th>业务线</th><th>类型</th><th>最近轮询</th><th>发现/新增/跳过</th><th>状态</th></tr></thead>
        <tbody id="srctbody"></tbody>
      </table>
    </div>
    <div class="modal-action"><form method="dialog"><button class="btn btn-sm">关闭</button></form></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
const TABS = [["new","待下载","#00a1d6"],["ready","待发布","#22c55e"],["published","已发布","#a78bfa"],["failed","失败","#f43f5e"],["skipped","已跳过","#94a3b8"]];
// 内容线图标/配色: 全部由 settings.line_icons 配置 {slug:["emoji","显示名","badge样式(可选)"]},
// stats 下发; 未配置的线名 🏷兜底, 颜色按哈希
const lineIcons = {};
function lineIcon(l){return (lineIcons[l]||["🏷",l||""])[0]}
function lineName(l){return (lineIcons[l]||["🏷",l||""])[1]}
const linesSeen = new Set();   // 只收真实数据里出现过的线名, 不预置示例名
function lineBadge(l){  // 线名哈希给柔和底色(line_icons 第三元素可覆盖)
  if (lineIcons[l] && lineIcons[l][2]) return lineIcons[l][2];
  let h=0; for (const c of String(l||"")) h=(h*31+c.charCodeAt(0))%360;
  return `background:hsl(${h} 65% 92%);color:hsl(${h} 45% 30%)`;
}
const TABQ = {new: "new,downloaded"};
const STNAME = {new:"待下载",downloaded:"处理中",ready:"待发布",published:"已发布",failed:"失败",skipped:"已跳过"};
const STCOLOR = {new:"#00a1d6",downloaded:"#00a1d6",ready:"#22c55e",published:"#a78bfa",failed:"#f43f5e",skipped:"#94a3b8"};
let cur = "ready", curLine = "", tids = {}, counts = {};
let curItems = [], hasMore = false, dwItem = null, dwDirty = false;

async function api(path, method="GET", body) {
  const r = await fetch(path, {method, headers:{"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { const t = await r.text(); let d; try { d = JSON.parse(t).detail; } catch {} throw new Error(d || t); }
  return r.json();
}
function toast(msg, kind) {
  const t = document.getElementById("toast");
  const cls = kind === "ok" ? "alert-success" : kind === "err" ? "alert-error" : "alert-info";
  t.innerHTML = `<div class="alert ${cls} text-sm py-2.5 shadow-lg">${esc(msg)}</div>`;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 3200);
}
function busy(btn, on) { btn.classList.toggle("busy", on); btn.disabled = on; }
function fmtDur(s) { s = Math.round(s||0); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmtDtime(t) { return new Date(t*1000).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

async function loadStats() {
  const s = await api("/api/stats");
  counts = s.counts || {};
  Object.assign(lineIcons, s.line_icons || {});
  renderNav();
  const stat = (icon, label, val, color, bar) =>
    `<div class="flex items-center gap-2.5 bg-base-100 border border-base-300 rounded-lg px-3.5 py-2 min-w-[118px]">
      <span class="text-[17px]" ${color?`style="color:${color}"`:""}>${icon}</span>
      <div class="min-w-[52px]">
        <div class="text-[10px] text-base-content/45 leading-none">${label}</div>
        <div class="text-[13.5px] font-bold mt-1 leading-none" ${color?`style="color:${color}"`:""}>${val}</div>
        ${bar?`<div class="h-[3px] rounded-full bg-base-300 mt-1.5 overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100,bar)}%;background:${bar>=100?"#fb7299":"#00a1d6"}"></div></div>`:""}
      </div>
    </div>`;
  const logins = [["bilibili", s.login_ok], ...Object.entries(s.extra_login || {})];
  const loginDots = logins.map(([p, ok]) =>
    `<span class="inline-flex items-center gap-1 mr-2" title="${esc(platsInfo[p]?.name||p)}${ok===true?" 已登录":ok===false?" 未登录":" 未知"}">
      <i class="inline-block w-[7px] h-[7px] rounded-full" style="background:${ok===true?"#22c55e":ok===false?"#f43f5e":"#94a3b8"}"></i><span class="text-[11.5px]">${esc(platsInfo[p]?.name||p)}</span></span>`).join("");
  const fmtPoll = sec => sec==null ? "—" : sec>=3600
    ? `${Math.floor(sec/3600)}h${Math.round(sec%3600/60)?Math.round(sec%3600/60)+"m":""}`
    : `${Math.ceil(sec/60)}分钟`;
  const pubPct = s.daily_limit ? s.published_today/s.daily_limit*100 : 0;
  const dlPct = s.daily_download_limit ? s.downloaded_today/s.daily_download_limit*100 : 0;
  document.getElementById("stats").innerHTML = [
    `<div class="flex items-center gap-2.5 bg-base-100 border border-base-300 rounded-lg px-3.5 py-2">
      <span class="text-[17px]">🔑</span>
      <div>
        <div class="text-[10px] text-base-content/45 leading-none">登录态</div>
        <div class="mt-1.5 leading-none">${loginDots||'<span class="text-[11px] opacity-50">无启用平台</span>'}</div>
      </div>
    </div>`,
    stat("📤", "今日发布", `${s.published_today}/${s.daily_limit||"∞"}`,
         s.published_today>=s.daily_limit?"#fb7299":null, pubPct),
    stat("⬇️", "今日下载", `${s.downloaded_today}/${s.daily_download_limit||"∞"}`,
         s.downloaded_today>=s.daily_download_limit?"#fb7299":null, dlPct),
    stat("⏰", "下轮轮询", fmtPoll(s.next_poll_in)),
    stat("💾", "磁盘可用", `${s.disk_free_gb}G`, s.disk_free_gb<15?"#f59e0b":null),
    stat("🤖", "LLM", s.llm_enabled?"开启":"关闭", s.llm_enabled?"#22c55e":"#94a3b8"),
  ].join("");
  document.getElementById("foot").innerHTML = `队列占用 ${s.downloads_gb}G<br>${new Date().toLocaleDateString()} 周${"日一二三四五六"[new Date().getDay()]}`;
}

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map(([k,n,c]) => {
    const cnt = (TABQ[k]||k).split(",").reduce((a,s)=>a+(counts[s]||0),0);
    return `<div class="flex items-center gap-2.5 px-3 py-2 rounded-lg cursor-pointer text-[13px]
      ${k===cur ? "nav-act font-semibold" : "text-base-content/60 hover:bg-base-200"}"
      onclick="switchTab('${k}')">
      <span class="w-1.5 h-1.5 rounded-full" style="background:${c}"></span>
      <span class="flex-1">${n}</span>
      ${cnt?`<span class="badge badge-xs ${k===cur?"":"badge-ghost"}" ${k===cur?'style="background:#fb7299;color:#fff;border:0"':""}>${cnt}</span>`:""}
    </div>`;
  }).join("");
  const lineOpts = [["","全部"], ...[...linesSeen].sort().map(l => [l, `${lineIcon(l)} ${lineName(l)}`])];
  document.getElementById("lines").innerHTML = lineOpts.map(([v,n]) =>
    `<div class="px-3 py-1.5 rounded-lg cursor-pointer text-[12.5px]
      ${v===curLine ? "nav-act font-semibold" : "text-base-content/60 hover:bg-base-200"}"
      onclick="setLine('${v}')">${n}</div>`).join("");
}
function switchTab(k) { cur = k; renderNav(); closeDrawer(); loadItems(); }
function setLine(v) { curLine = v; renderNav(); loadItems(); }

async function loadItems(append) {
  const offset = append ? curItems.length : 0;
  const {items} = await api(`/api/items?status=${TABQ[cur]||cur}&limit=100&offset=${offset}${curLine?"&line="+curLine:""}`);
  curItems = append ? curItems.concat(items) : items;
  items.forEach(i => i.line && linesSeen.add(i.line));
  hasMore = items.length === 100;
  renderList();
}

function extraBadges(it) {
  try {
    return Object.entries(JSON.parse(it.extra_pub||"{}")).map(([p,r]) => {
      const ok = r.ok === true ? ["badge-success text-white","✓", r.bvid||""]
             : r.ok === false ? ["badge-error text-white","✗", r.msg||"失败"]
             : ["badge-ghost","−", r.msg||"未投递"];
      return `<span class="badge badge-xs ${ok[0]}" title="${esc(ok[2])}">${ok[1]} ${esc(r.name||p)}</span>`;
    }).join("");
  } catch(e) { return ""; }
}
function subBadge(it) {
  if ((it.file_path||"").includes("_sub")) return `<span class="badge badge-xs badge-success text-white">烧录中字</span>`;
  if (it.subtitle_path) return `<span class="badge badge-xs badge-warning">外挂字幕</span>`;
  if (it.status==="ready") return `<span class="badge badge-xs b-nosub">无字幕</span>`;
  return "";
}

function renderList() {
  const q = (document.getElementById("q")?.value || "").trim().toLowerCase();
  const shown = q ? curItems.filter(it =>
    ((it.title||"")+(it.orig_title||"")+(it.uploader||"")).toLowerCase().includes(q)) : curItems;
  document.getElementById("cnt").textContent = `${shown.length} 条`;
  const el = document.getElementById("list");
  const wrap = document.getElementById("gridwrap"), sy = wrap.scrollTop;
  if (!shown.length) {
    el.innerHTML = `<div class="col-span-full text-center py-20 text-base-content/40">
      <div class="text-4xl mb-3 opacity-50">📭</div>${q?"没有匹配条目":"暂无条目"}</div>`;
    return;
  }
  el.innerHTML = shown.map(it => `
    <div class="gcard st-${it.status} card bg-base-100 border border-base-300 cursor-pointer
      hover:shadow-lg hover:-translate-y-0.5 transition-all" id="card-${it.id}" onclick="openDrawer(${it.id})">
      <figure class="relative aspect-video overflow-hidden rounded-t-xl">
        ${it.cover_path_url ? `<img src="${it.cover_path_url}" loading="lazy" class="w-full h-full object-cover">`
          : `<div class="no-cover w-full h-full"><span style="font-size:26px;opacity:.5">📺</span><span>${STNAME[it.status]||it.status} · 无封面</span></div>`}
        <span class="absolute right-1.5 bottom-1.5 bg-black/75 text-white text-[10px] px-1.5 py-0.5 rounded">${fmtDur(it.duration)}</span>
      </figure>

async function save(id) {
  const g = n => document.getElementById(n);
  const dt = g("dwdt").value.trim();
  const m = dt.match(/^(\d{1,2}):(\d{2})$/);
  let dtime;
  if (m) {
    const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
    if (d.getTime() - Date.now() < 4*3600*1000) d.setDate(d.getDate()+1);
    dtime = Math.floor(d.getTime()/1000);
  } else if (!dt) dtime = 0;
  const dwplAll = [...document.querySelectorAll(".dwpl")];
  const plats = dwplAll.filter(e=>e.checked).map(e=>e.dataset.pl)
    // 保留未渲染平台(已禁用/不在平台表)的旧勾选, 防静默丢配置
    .concat(dwSel ? [...dwSel].filter(p => !dwplAll.some(e=>e.dataset.pl===p)) : []);
  const body = {
    title: g("dwt").value,
    description: g("dwd").value,
    tags: g("dwg").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    tid: +g("dwp").value,
    mission_id: +(g("dwm").value||0),
    copyright: +g("dwcr").value || undefined,
  };
  // 原本无显式勾选(null=跟随启用集)且现在全勾 → 不写字段, 保留动态语义
  if (!(dwSel === null && plats.length === dwplAll.length))
    body.pub_platforms = plats;
  if (dtime !== undefined) body.dtime = dtime;   // 非法时间格式则保留原值
  await api(`/api/items/${id}`, "PATCH", body);   // 单请求原子保存
  dwDirty = false;
  toast("已保存", "ok");
}

async function regen(id) {
  toast("LLM 生成中…");
  let m;
  try { m = await api(`/api/items/${id}/regen`, "POST"); }
  catch(e) { toast(e.message, "err"); return; }
  document.getElementById("dwt").value = m.title;
  document.getElementById("dwd").value = m.desc;
  document.getElementById("dwg").value = m.tags.join(", ");
  document.getElementById("dwtc").textContent = m.title.length + "/80";
  toast("已重新生成，记得保存", "ok");
}

async function publish(id, force, btn) {
  if (btn) busy(btn, true);
  try {
    await save(id);
    await api(`/api/items/${id}/publish${force?"?force=1":""}`, "POST");
    toast("投稿任务已提交");
  } catch(e) { toast(e.message, "err"); }
  if (btn) busy(btn, false);
}

async function skip(id) {
  if (!confirm("跳过此条并删除本地文件？（保留去重记录）")) return;
  try { await api(`/api/items/${id}/skip`, "POST"); closeDrawer(); loadAll(); } catch(e){ toast(e.message, "err"); }
}
async function unskip(id) { try { await api(`/api/items/${id}/unskip`, "POST"); toast("已恢复，将重新下载","ok"); closeDrawer(); loadAll(); } catch(e){ toast(e.message, "err"); } }
let _missions = null;
async function loadMissions() {
  if (_missions) return;
  try {
    const {missions} = await api("/api/missions");
    _missions = missions || [];
    document.getElementById("missionlist").innerHTML =
      _missions.map(m => `<option value="${m.mission_id}">${esc(m.name||"")}</option>`).join("");
  } catch(e) {}
}
async function doVerify() {
  try {
    const r = await api("/api/verify","POST");
    const dead = (r.results||[]).filter(x => x.alive === false).length;
    toast(`巡检完成: ${dead} 条失效`, dead ? "err" : "ok"); loadAll();
  } catch(e){ toast(e.message, "err"); }
}
async function doReconcile() {
  try {
    const r = await api("/api/reconcile","POST");
    toast(`调和完成: 清残留${(r.orphans_cleaned||[]).length} · 中途态${(r.stuck_downloaded||[]).length}`,"ok");
    loadAll();
  } catch(e){ toast(e.message,"err"); }
}

      const opts = type.slice(4).split("|");
      return `<div>${lab(label,hint)}
        <select id="${id}" class="select select-sm select-bordered w-full">${opts.map(o =>
          `<option value="${o}" ${v===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
    }
    if (type === "platforms") {
      const rows = Object.entries(platsInfo).filter(([p])=>p!=="bilibili").map(([p,c]) =>
        `<label class="flex items-center gap-1.5 text-[12px] cursor-pointer py-0.5" data-pl="${esc(p)}"><input type="checkbox"
          class="checkbox checkbox-primary checkbox-xs plat-sel"
          ${c.enabled?"checked":""}><span class="whitespace-nowrap">${esc(c.name)}</span><code class="text-[9.5px] opacity-40">${esc(p)}</code></label>`).join("");
      return `<div class="col-span-2" id="${id}">${lab(label,hint)}
        <div class="grid grid-cols-3 gap-x-4 rounded-lg bg-base-100/60 border border-base-300/40 p-2.5">${rows}</div></div>`;
    }
    if (type === "dict")
      return `<div class="col-span-2">${lab(label,hint)}
        <textarea id="${id}" rows="3" class="textarea textarea-bordered textarea-sm w-full font-mono text-[11px] leading-relaxed">${esc(JSON.stringify(v||{},null,1))}</textarea></div>`;
    if (type === "policy") {
      const pol = _cfgVal("subtitles.policy") || {}, OPTS = ["always","auto","subs_only","never"];
      const rows = Object.entries(pol).map(([ln,p]) =>
        `<div class="flex gap-2 items-center" data-pl="${esc(ln)}">
          <span class="text-[12px] w-28 truncate">${lineIcon(ln)} ${esc(ln)}</span>
          <select class="select select-xs select-bordered flex-1 pol-sel">${OPTS.map(o=>`<option ${o===p?"selected":""}>${o}</option>`).join("")}</select></div>`).join("");
      return `<div class="col-span-2" id="${id}">${lab(label,hint)}
        <div class="space-y-1.5 rounded-lg bg-base-100/60 border border-base-300/40 p-2.5">${rows}</div>
        <div class="flex gap-1.5 mt-1.5"><input id="${id}-new" class="input input-xs input-bordered w-36" placeholder="新线名(如 cooking)">
        <button type="button" class="btn btn-xs btn-outline" onclick="polAdd('${id}')">＋加线策略</button></div></div>`;
    }
    if (type === "lines")
      return `<div>${lab(label,hint)}
        <textarea id="${id}" rows="3" class="textarea textarea-bordered textarea-sm w-full text-[12px] font-mono" placeholder="每行一个">${esc((v||[]).join("\n"))}</textarea></div>`;
    if (type === "int" || type === "float")
      return `<div>${lab(label,hint)}
        <input type="number" id="${id}" min="0" ${type==="float"?'step="0.01"':'step="1"'}
          class="input input-sm input-bordered w-full" value="${v??""}" placeholder="${esc(hint||"")}"></div>`;
    const val = type === "csv" ? (v||[]).join(",") : (v ?? "");
    return `<div>${lab(label,hint)}
      <input type="text" id="${id}" class="input input-sm input-bordered w-full" value="${esc(String(val))}" placeholder="${esc(hint||"")}"></div>`;
  };
  document.getElementById("setbody").innerHTML = SGROUPS.map(([t, items]) =>
    `<div class="rounded-xl border border-base-300/50 bg-base-200/30 px-4 py-3 mb-3">
      <div class="text-[12px] font-bold text-primary mb-2.5 flex items-center gap-1.5">${t}</div>
      <div class="grid grid-cols-2 gap-x-4 gap-y-3">${items.map(([k,l,ty,h]) => inp(k,l,ty,h)).join("")}</div></div>`).join("") +
    `<div class="rounded-xl border border-base-300/50 bg-base-200/30 px-4 py-3">
      <div class="text-[12px] font-bold text-primary mb-2.5">📡 源管理</div><div id="srcadmin" class="text-[12px]"></div></div>`;
}
async function openSettings() {
  try {
    const [s, src] = await Promise.all([api("/api/settings"), api("/api/sources")]);
    renderSettings(s);
    renderSrcAdmin(src.sources);
    document.getElementById("setModal").showModal();
  } catch(e) { toast(e.message, "err"); }
}
function renderSrcAdmin(list) {
  list.forEach(s => s.line && linesSeen.add(s.line));
  document.getElementById("srcadmin").innerHTML =
    list.map(s => `<div class="flex items-center gap-2 py-1 border-b border-base-300/50">
      <input type="checkbox" class="checkbox checkbox-primary checkbox-xs" ${s.enabled?"checked":""}
        onchange="srcToggle('${s.name}',this.checked)" title="启用">
      <span class="font-medium">${esc(s.name)}</span>
      <span class="text-base-content/40">${lineIcon(s.line)}${s.kind||""}</span>
      <span class="text-base-content/35 truncate flex-1 text-[11px]">${esc(s.url||"")}</span>
      <button class="btn btn-xs btn-ghost text-error" onclick="srcDelete('${s.name}')">删</button></div>`).join("") +
    `<div class="flex gap-1.5 mt-2 items-center">
      <input id="newsrc-name" class="input input-xs input-bordered w-24" placeholder="名称">
      <input id="newsrc-url" class="input input-xs input-bordered flex-1" placeholder="URL(频道或搜索词)">
      <select id="newsrc-kind" class="select select-xs select-bordered"><option value="channel">channel</option><option value="search">search</option></select>
      <input id="newsrc-line" list="linelist" class="input input-xs input-bordered w-20" placeholder="内容线">
      <datalist id="linelist">${[...linesSeen].map(l=>`<option value="${l}">${lineName(l)}</option>`).join("")}</datalist>
      <input id="newsrc-limit" class="input input-xs input-bordered w-14" placeholder="限量">
      <button class="btn btn-xs btn-primary" onclick="srcAdd()">＋加源</button></div>`;
}
async function srcToggle(name, on) {
  try { await api(`/api/sources/${name}/toggle?enabled=${on}`, "POST"); toast(`${name} ${on?"启用":"停用"}`,"ok"); }
  catch(e) { toast(e.message, "err"); const {sources}=await api("/api/sources"); renderSrcAdmin(sources); }
}
async function srcDelete(name) {
  if (!confirm(`删除源 ${name}？(已入库条目不受影响)`)) return;
  try { await api(`/api/sources/${name}`, "DELETE");
    const {sources} = await api("/api/sources"); renderSrcAdmin(sources); toast("已删除","ok");
  } catch(e) { toast(e.message, "err"); }
}
async function srcAdd() {
  const g = id => document.getElementById(id).value.trim();
  try {
    await api("/api/sources", "POST", {
      name: g("newsrc-name"), url: g("newsrc-url"), kind: g("newsrc-kind"),
      line: g("newsrc-line"), limit: g("newsrc-limit") ? +g("newsrc-limit") : ""});
    const {sources} = await api("/api/sources"); renderSrcAdmin(sources); toast("已添加","ok");
  } catch(e) { toast(e.message, "err"); }
}
function polAdd(id) {
  const inp = document.getElementById(id + "-new"), ln = (inp.value || "").trim().toLowerCase();
  if (!/^[a-z0-9][a-z0-9_-]{0,19}$/.test(ln)) { toast("线名需小写字母/数字/_/-, ≤20字符", "err"); return; }
  const box = document.getElementById(id);
  if (box.querySelector(`[data-pl="${ln}"]`)) { toast("该线已存在", "err"); return; }
  const OPTS = ["always","auto","subs_only","never"];
  const row = document.createElement("div");
  row.className = "flex gap-2 items-center"; row.dataset.pl = ln;
  row.innerHTML = `<span class="text-[12px] w-28 truncate">🏷 ${ln}</span>
    <select class="select select-xs select-bordered flex-1 pol-sel">${OPTS.map(o=>`<option>${o}</option>`).join("")}</select>`;
  box.querySelector(".space-y-1\\.5").appendChild(row); inp.value = "";
}
async function saveSettings() {
  const body = {};
  for (const [, items] of SGROUPS) for (const [key,,type] of items) {
    const [sec, ...rest] = key.split("."), last = rest[rest.length-1];
    const el = document.getElementById(_fieldId(key));
    if (!el) continue;
    let v;
    if (type === "bool") v = el.checked;
    else if (type === "int" || type === "float") { if (el.value.trim()==="") continue; v = +el.value; }
    else if (type === "copy") v = +el.value;
    else if (type === "csv") v = el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if (type === "lines") v = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
    else if (type === "dict") { try { v = JSON.parse(el.value || "{}"); } catch(e) { toast(`${key} JSON 格式错误`, "err"); continue; } }
    else if (type === "policy") { v = {}; el.querySelectorAll("[data-pl]").forEach(r =>
      v[r.dataset.pl] = r.querySelector(".pol-sel").value); }
    else if (type === "platforms") { v = {}; el.querySelectorAll("[data-pl]").forEach(r => {
      const p = r.dataset.pl, on = r.querySelector(".plat-sel")?.checked ?? false, old = _cfg?.extra_platforms?.[p];
      if (on || old) v[p] = {enabled: on, account: old?.account || "main"}; }); }
    else if (type?.startsWith("sel:")) v = el.value;
    else v = el.value;
    body[sec] = body[sec] || {};
    if (!rest.length) { body[sec] = v; continue; }   // 顶层字段(extra_platforms等)
    let t = body[sec];
    for (let i = 0; i < rest.length - 1; i++) t = t[rest[i]] = t[rest[i]] || {};
    t[last] = v;
  }
  try {
    const r = await api("/api/settings", "PUT", body);
    try { platsInfo = await api("/api/platforms"); platsReady = true; renderPlatSub(); } catch(e) {}
    toast(`已保存 ${Object.keys(r.applied||{}).length} 项，即时生效`, "ok");
  } catch(e) { toast(e.message, "err"); }
}
async function showSources() {
  try {
    const {sources} = await api("/api/sources");
    sources.forEach(s => s.line && linesSeen.add(s.line));
    document.getElementById("srctbody").innerHTML = sources.map(s => {
      const h = s.health;
      const t = h ? new Date(h.t*1000).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
      const st = !s.enabled ? `<span class="badge badge-xs">停用</span>`
        : h && h.error ? `<span class="badge badge-xs badge-error" title="${esc(h.error)}">出错</span>`
        : h ? `<span class="badge badge-xs badge-success">正常</span>`
        : `<span class="badge badge-xs badge-ghost">未轮询</span>`;
      return `<tr class="${s.enabled?"":"opacity-40"}"><td class="font-medium">${esc(s.name)}</td>` +
        `<td>${lineIcon(s.line)} ${esc(lineName(s.line))}</td><td>${esc(s.kind||"")}</td>` +
        `<td>${t}</td><td>${h?`${h.found}/${h.new}/${h.skipped}`:"—"}</td><td>${st}</td></tr>`;
    }).join("");
    document.getElementById("srcModal").showModal();
  } catch(e){ toast(e.message,"err"); }
}
async function doCleanup() {
  if (!confirm("清理孤儿/skipped/超期 failed 的本地文件？")) return;
  try {
    const r = await api("/api/cleanup?days=7", "POST");
    toast(`清理完成: 释放 ${r.freed_gb}GB`, "ok"); loadAll();
  } catch(e){ toast(e.message, "err"); }
}
async function retryItem(id) { try { await api(`/api/items/${id}/retry`, "POST"); closeDrawer(); loadAll(); } catch(e){ toast(e.message, "err"); } }
async function cleanFiles(id) {
  if (!confirm("删除该稿件的本地视频/封面/字幕文件？(不可恢复，无法再补投)")) return;
  try { await api(`/api/items/${id}/files`, "DELETE"); toast("文件已清理","ok"); closeDrawer(); loadAll(); }
  catch(e){ toast(e.message, "err"); }
}
async function doPoll() { try { await api("/api/poll","POST"); toast("轮询已启动","ok"); } catch(e){ toast(e.message, "err"); } }
async function downloadOne(id, btn) {
  if (btn) busy(btn, true);
  try { await api(`/api/items/${id}/download`,"POST"); toast("已加入下载任务","ok"); }
  catch(e){ toast(e.message, "err"); }
  if (btn) busy(btn, false);
}
async function doImport(btn) {
  const path = document.getElementById("impPath").value.trim();
  if (!path) { toast("请填文件路径", "err"); return; }
  busy(btn, true);
  try {
    const r = await api("/api/import", "POST", {
      path, line: document.getElementById("impLine").value.trim() || "local",
      title: document.getElementById("impTitle").value.trim(),
      process: document.getElementById("impProc").checked });
    document.getElementById("impModal").close();
    toast(r.job_id ? `已导入 #${r.id}, 处理中…` : `已导入 #${r.id}`, "ok");
    loadAll();
  } catch(e) { toast(e.message, "err"); }
  busy(btn, false);
}
let _biliAuth = "", _biliTimer = null;
async function openBiliLogin() {
  const st = document.getElementById("biliQrStatus");
  document.getElementById("biliModal").showModal();
  st.textContent = "生成中…"; document.getElementById("biliQr").src = "";
  if (_biliTimer) { clearInterval(_biliTimer); _biliTimer = null; }
  try {
    const r = await api("/api/bili/qrcode");
    _biliAuth = r.auth_code;
    document.getElementById("biliQr").src = r.img;
    st.textContent = "等待扫码…";
    _biliTimer = setInterval(async () => {
      try {
        const p = await api("/api/bili/qrcode/poll?auth_code=" + _biliAuth);
        const s = p.status;
        if (s === "done") {
          clearInterval(_biliTimer); _biliTimer = null;
          st.textContent = "✅ 登录成功";
          toast("B站登录成功", "ok");
          setTimeout(() => { document.getElementById("biliModal").close(); loadStats(); }, 800);
        } else if (s === "scanned") { st.textContent = "已扫码, 请在APP上确认"; }
        else if (s === "expired") {
          clearInterval(_biliTimer); _biliTimer = null;
          st.textContent = "二维码已过期, 点「重新生成」";
        } else if (s === "error") {
          clearInterval(_biliTimer); _biliTimer = null;
          st.textContent = "登录失败: " + (p.msg || "");
        }
      } catch(e) {}
    }, 2000);
  } catch(e) { st.textContent = "生成失败: " + e.message; }
}
document.getElementById("biliModal").addEventListener("close",
  () => { if (_biliTimer) { clearInterval(_biliTimer); _biliTimer = null; } });
async function doDownload() { try { await api("/api/download","POST"); toast("批量下载已启动","ok"); } catch(e){ toast(e.message, "err"); } }
async function doPublishAll(schedule) {
  if (!confirm(schedule ? "按错峰档位批量定时发布全部 ready 条目？" : "立即批量发布全部 ready 条目？")) return;
  try { await api(`/api/publish-all?schedule=${schedule}`,"POST"); toast(schedule?"错峰发布已启动":"批量发布已启动","ok"); }
  catch(e){ toast(e.message, "err"); }
}

let wasActive = false, _hist = [], _histAt = 0, _prevProg = new Set();
async function pollJobs() {
  try {
    const [{jobs}, {progress}] = await Promise.all(
      [api("/api/jobs"), api("/api/progress")]);
    const running = jobs.filter(j => j.status === "running");
    const recent = jobs.filter(j => j.status !== "running" && (Date.now()/1000 - j.ts) < 120);
    const active = running.length > 0 || Object.keys(progress).length > 0;
    // 单条加工完成(进度键消失)即刷新列表: 多任务并行时不必等全部空闲
    const curIds = new Set(Object.keys(progress).map(Number));
    if ([..._prevProg].some(x => !curIds.has(x))) {
      loadAll();
      if (dwItem && !dwDirty) openDrawer(dwItem.id);
    }
    _prevProg = curIds;
    const box = document.getElementById("jobs"), fab = document.getElementById("jobsfab");
    if (Date.now() - _histAt > 15000) {
      _histAt = Date.now();
      api("/api/job-history?limit=20").then(r => { _hist = r.history || []; }).catch(() => {});
    }
    fab.classList.toggle("hidden", !(active || recent.length || _hist.length));
    document.getElementById("jobsn").textContent = running.length + Object.keys(progress).length || "";
    const histHtml = _hist.length ?
      `<div class="px-3 py-1.5 font-bold text-base-content/40 border-b border-base-300 bg-base-200/60">📋 历史任务</div>` +
      _hist.map(h =>
        `<div class="px-3 py-1 opacity-45 flex items-center gap-1.5"><span class="${h.status==="done"?"text-success":"text-error"}">●</span>` +
        `<span>${esc(h.job)}</span><span class="text-base-content/40 truncate flex-1">${esc(h.brief||"")}</span>` +
        `<span class="text-base-content/35 whitespace-nowrap">${new Date(h.t*1000).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></div>`).join("") : "";
    if (active || recent.length) {
      box.innerHTML = `<div class="px-3 py-2 font-bold text-base-content/60 border-b border-base-300 sticky top-0 bg-base-100">任务中心 · ${running.length + Object.keys(progress).length} 在跑</div>` +
        Object.entries(progress).map(([id, p]) =>
          `<div class="px-3 py-2 border-b border-base-300">⏳ <b>#${id}</b> ${p.stage}` +
          (p.pct != null ? ` <b class="text-primary">${Math.round(p.pct * 100)}%</b>` : "") +
          ` <span class="text-base-content/45 text-[11px] block mt-0.5">${esc(p.detail || "")}</span></div>`).join("") +
        running.map(j =>
          `<div class="px-3 py-2 border-b border-base-300"><span class="text-info">●</span> ${j.name}` +
          (j.log || []).slice(-4).map(l => `<div class="text-base-content/45 text-[11px] mt-0.5">${esc(l)}</div>`).join("") + `</div>`).join("") +
        recent.map(j =>
          `<div class="px-3 py-2 opacity-55"><span class="${j.status==="done"?"text-success":"text-error"}">●</span> ${j.name} — ${j.status}` +
          (j.result ? `<div class="text-base-content/45 text-[11px] mt-0.5">${esc(JSON.stringify(j.result).slice(0,120))}</div>` : "") + `</div>`).join("") + histHtml;
      document.querySelectorAll("[id^=prog-],[id^=dprog-]").forEach(e => { e.textContent = ""; e.classList.add("hidden"); });
      document.querySelectorAll("[id^=pb-],[id^=dpb-]").forEach(e => e.classList.add("hidden"));
      for (const [id, p] of Object.entries(progress)) {
        for (const [tid, bid] of [[`prog-${id}`,`pb-${id}`],[`dprog-${id}`,`dpb-${id}`]]) {
          const t = document.getElementById(tid), b = document.getElementById(bid);
          if (t) { t.classList.remove("hidden"); t.textContent = `⏳ ${p.stage}${p.pct != null ? " " + Math.round(p.pct * 100) + "%" : ""} ${p.detail || ""}`; }
          if (b && p.pct != null) { b.classList.remove("hidden"); b.value = Math.round(p.pct * 100); }
        }
      }
    } else {
      box.classList.add("hidden");
      if (_hist.length)
        box.innerHTML = `<div class="px-3 py-2 font-bold text-base-content/60 border-b border-base-300 sticky top-0 bg-base-100">任务中心 · 空闲</div>` + histHtml;
      if (wasActive) { loadAll(); if (dwItem && !dwDirty) openDrawer(dwItem.id); }
    }
    wasActive = active;
  } catch (e) {}
}
setInterval(pollJobs, 4000);
setInterval(loadStats, 30000);

async function loadAll() { renderNav(); await loadStats(); await loadItems(); }
function renderPlatSub() {
  const names = Object.entries(platsInfo).filter(([,c])=>c.enabled).map(([,c])=>c.name);
  const el = document.getElementById("platSub");
  if (el && names.length) el.textContent = `视频搬运中台 · ${names.join("/")}`;
}
(async () => { tids = await api("/api/tids");
  try { platsInfo = await api("/api/platforms"); platsReady = true; } catch(e) {}
  renderPlatSub();
  await loadAll(); })();
</script>
