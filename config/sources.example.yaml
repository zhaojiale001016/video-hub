# ============================================================
# video-hub 订阅配置模板
# 首次启动自动复制为 config/sources.yaml(本地私有, 不入库)。
# 之后所有改动建议走 Web UI「⚙ 设置」→ 写入 config/overrides.json,
# 本文件保持出厂状态, 升级不丢配置。
# ============================================================

settings:
  # 可选：前端内容线图标/显示名/徽标配色 {slug: ["emoji","名称","badge样式(可选)"]}
  # line_icons:
  #   my_line: ["🏷", "我的线", "background:#eef;color:#336"]
  # 外网代理（下载 YouTube/TikTok 必需）。留空则读环境变量 https_proxy
  proxy: ""                      # 例: "http://127.0.0.1:7890"
  # 可选：yt-dlp cookies 文件（YouTube 触发人机验证时导出 cookies.txt 填这里）
  cookies_file: ""
  max_height: 1080               # 清晰度上限
  poll_limit: 15                 # 每源每轮最多发现的新视频数
  daily_upload_limit: 5          # 每日投稿上限（养号期建议 1-3）
  default_copyright: 1           # 1=自制(可参加活动) 2=转载(需source,禁活动)
  daily_download_limit: 5        # 每日自动下载+生成上限；手动单条下载不受限
  download_dir: "data/downloads"
  db_file: "data/pipeline.db"
  archive_file: "data/downloaded.archive"
  biliup_bin: "bin/biliup"       # B站投稿器, 见 README「安装 biliup」
  biliup_cookie: "data/cookies.json"
  submit_api: "app"               # B站投稿提交接口: app(荐)/web(客户端接口已被B站废弃)
  tencent_content_label: "none"   # 视频号「视频标注」: none=不勾选; 也可填"含AI生成内容"等文案
  # 无人值守: 按间隔自动轮询(+自动下载)。0=手动
  auto_poll_interval_min: 360
  auto_workdays_only: true       # 周六日不自动执行, 手动不受影响
  auto_download_after_poll: true # 轮询完自动下载+生成标题
  delete_after_publish: true     # 投稿成功后删除本地文件
  trim_black_intro: true         # 剪掉片头纯黑段(0.4s~8s): 防平台回落到黑首帧当封面
  publish_slots: ["12:00", "18:00", "19:30", "21:00", "22:30"]  # 错峰定时档
  per_source_poll_cap: 15        # 每源每轮发现上限(防单一搜索源刷爆队列)
  min_free_gb: 10                # 磁盘剩余低于此值暂停下载
  precheck_before_download: true # 下载前先搜B站撞稿, ≥85%相似直接跳过

# 中文字幕(生肉→熟肉; 开启后每条多耗时1-5分钟)
subtitles:
  enabled: true
  whisper_model: "small"   # tiny/base/small/medium; 探测+转写共用
  whisper_device: "cpu"    # cpu/mps(M系芯片约2x,失败自动回退cpu)
  burn: true               # 烧进画面
  font_size: 0             # 0=按高度自适应(1080p≈60, 720p≈40)
  margin_v: 0              # 0=自适应(画面高7.5%)
  policy:                  # 按内容线(line)配默认策略; 源上可写 subtitle: 覆盖
    music: "subs_only"     # 示例: 只翻官方字幕(无语音/转写不可靠的线)
    relax: "auto"          # 示例: 官方字幕→翻译, 没有→探测有语音才转写
    adventure: "auto"      # 示例: 探测到解说/旁白就配中字
    # 自定义内容线直接在下面加一行即可, 如: gaming: "always"
  # 策略取值: always(强制转写) | auto(探测) | subs_only(仅翻官方) | never(不配)

# 撞稿屏蔽名单
blacklist:
  uploaders: []            # 原作者在目标平台有官方号的 UP 主
  keywords:
    - "official trailer"   # 预告片一般不搬

# LLM 标题生成
# backend: kscc=本地kscc CLI | api=OpenAI兼容接口(export LLM_API_KEY=sk-xxx)
llm:
  enabled: true
  backend: "kscc"
  model: "sn"
  timeout: 120
  api_key_env: "LLM_API_KEY"
  # 自定义内容线的标题风格提示词(键=线名)。内置 music/relax/adventure,
  # 未配置的线用通用风格。例:
  # line_styles:
  #   gaming: "B站游戏区风格：突出高光操作/版本热点，可用【游戏名】前缀"
  #   cooking: "B站美食区风格：突出食欲感和过程治愈，口语化"
  base_url: "https://api.deepseek.com/v1"

# 多平台投递(登录: cli.py login-ks / login-sph 扫码)
# 附加发布平台: 13 个 sau 视频平台均可勾选(设置面板直接勾)
# kuaishou 快手 / tencent 视频号 / douyin 抖音 / xiaohongshu 小红书 /
# baijiahao 百家号 / weibo 微博 / youtube / facebook-page / instagram /
# alipay 支付宝 / hupu 虎扑 / dayu 大鱼号 / zhihu 知乎
# 每个平台先跑 `python cli.py login-extra <平台id>` 扫码登录,
# 再在设置面板或此处把 enabled 打开。
# 注意能力差异: 知乎/FB主页不支持封面; 微博/小红书/百家号等不支持定时发布。
extra_platforms:
  # ⚠️ 全部默认关闭——B站是内置唯一默认投递端。
  # 要用哪个平台: 先 cli.py login-extra <平台id> 扫码登录, 再把 enabled 改 true。
  # sau 支持的平台: kuaishou/tencent/douyin/xiaohongshu/weibo/baijiahao/tiktok 等
  kuaishou: {enabled: false, account: "main"}    # 快手
  tencent:  {enabled: false, account: "main"}    # 微信视频号
  # douyin: {enabled: false, account: "main"}   # 抖音(示例, 登录后开启)

# 自动参加B站投稿活动(投稿页"参与活动"，需已登录)
missions:
  enabled: true
  # match 键=内容线名, 值=B站活动名里的匹配关键词。自定义线名直接加即可
  match:
    music: ["音乐", "现场", "演出"]        # 示例: 按活动名/稿件上下文双向匹配
    relax: ["生活", "手工", "记录"]
    adventure: ["户外", "自然", "纪实"]

# ============================================================
# 订阅源 —— 以下为示例, 按需增删(UI「⚙ 设置」底部可加源)
# kind: channel(频道/videos) | search(ytsearch关键词)
# line: 自定义内容线名(小写字母/数字/_/- ≤20字符), 三线内置示例仅供参考,
#       可自由定义如 gaming/cooking/asmr; 线名驱动 subtitles.policy、
#       missions.match、llm.line_styles 三处同名 key 的配置
# tid:  B站分区号（见 config/tids.json）
# ============================================================
sources:
  # ⚠️ 示例块整段注释——真实源请自己配, 不会自动抓任何东西。
  # 每条源结构如下(复制改 url/line/tid 即可):
  #
  # - name: my_source_1            # 源标识(唯一)
  #   line: music                  # 内容线 slug(自定义, 关联下面字幕/活动/风格配置)
  #   kind: channel                # channel=频道videos | playlist | search=关键词搜
  #   url: "https://www.youtube.com/@SOMEONE/videos"
  #   tid: 29                      # B站分区号(见 config/tids.json)
  #   category: "投稿分类文案"      # 可选, 进LLM上下文
  #   tags: ["标签1", "标签2"]      # 可选, 合并进稿件tags
  #   subtitle: "always"           # 可选, 覆盖线级字幕策略
  #   min_duration: 60             # 可选, 秒, 过短跳过
  #   max_duration: 3600           # 可选
  #   limit: 5                     # search 源: 每次发现上限
  #   min_height: 720 / max_height: 2160   # 可选, 清晰度窗口
  #   enabled: true
  #
  # search 源 url 写法: "ytsearch5:你的搜索关键词"  (5=每次拉取量)
